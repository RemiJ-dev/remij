---
# Development environment override
services:
  slides:
    image: marpteam/marp-cli:v4.5.1
    env_file:
      - path: .env.docker.local
        required: false
    environment:
      - LANG=$LANG
      # Run Marp with the host user, see https://github.com/marp-team/marp-cli#docker
      - MARP_USER=${UID:-1000}:${GID:-1000}
    volumes:
      - .:/home/marp/app
    ports:
      - '8080:8080'
      - '37717:37717'
    command: --watch --server

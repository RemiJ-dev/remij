name: Tests

on:
  workflow_dispatch: ~
  push:
    branches:
      - main
  pull_request:

jobs:

  tests:
    name: 'Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7.0.1

      - name: 'Setup node'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: 'Setup PHP'
        uses: shivammathur/setup-php@v2
        with:
          coverage: "none"
          ini-values: "memory_limit=-1"
          php-version: "8.5"
          tools: symfony

      - name: 'Determine composer cache directory'
        id: composer-cache
        run: echo "::set-output name=directory::$(composer config cache-dir)"

      - name: 'Cache composer dependencies'
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: composer-${{ hashFiles('composer.lock') }}

      - name: 'Cache resized images'
        uses: actions/cache@v6.1.0
        with:
          path: public/resized
          key: resized-images-tests-${{ secrets.CACHE_VERSION }}

      - name: 'Install dependencies'
        id: deps
        run: |
          echo "::group::composer install"
            composer install --no-progress --ansi
          echo "::endgroup::"

          # echo "::group::install phpunit"
          #   vendor/bin/simple-phpunit install
          # echo "::endgroup::"

          echo "::group::npm install"
            npm install --color=always --no-progress --no-audit
          echo "::endgroup::"

          echo "::group::importmap install"
            php bin/console importmap:install --ansi
          echo "::endgroup::"

      - name: 'Warmup'
        run: |
          bin/console cache:clear --ansi --no-warmup
          bin/console cache:warmup --ansi
        env:
          APP_ENV: test

      - name: 'Composer validate'
        if: always() && steps.deps.outcome == 'success'
        run: composer validate --no-check-publish

      - name: 'Lint'
        if: always() && steps.deps.outcome == 'success'
        run: make lint@integration PHP_CONT= DOCKER_COMP=

      - name: Run tests
        run: make test PHP_CONT= DOCKER_COMP=

      # Les SVG des diagrammes sont versionnés : le build de prod tourne sur le
      # serveur (Deployer -> `make build@dist`), qui n'a donc pas besoin de D2.
      # En contrepartie, `make build.diagrams` est une commande d'écriture, et
      # rien n'empêcherait un `.d2` modifié de partir sans son SVG régénéré —
      # l'ancien schéma serait alors déployé sans le moindre signal. On régénère
      # donc ici pour comparer.
      - name: 'Check diagrams are up to date'
        if: always()
        run: |
          # Version alignée sur celle de l'image de dev : régénérer avec une autre
          # version de D2 produirait un diff permanent.
          d2_version="$(grep -oP '^ARG D2_VERSION=\K.*' Dockerfile)"
          arch="$(dpkg --print-architecture)"

          echo "::group::install d2 ${d2_version} (${arch})"
            curl -fsSL "https://github.com/terrastruct/d2/releases/download/v${d2_version}/d2-v${d2_version}-linux-${arch}.tar.gz" -o /tmp/d2.tar.gz
            tar -xzf /tmp/d2.tar.gz -C /tmp
            sudo install -m 0755 "/tmp/d2-v${d2_version}/bin/d2" /usr/local/bin/d2
            d2 --version
          echo "::endgroup::"

          # `-B` est indispensable : un checkout frais donne à tous les fichiers le
          # même mtime, donc le rendu incrémental ne verrait aucune source plus
          # récente que sa cible et ne régénérerait rien — le contrôle ne
          # détecterait jamais rien.
          echo "::group::make -B build.diagrams"
            make -B build.diagrams PHP_CONT= DOCKER_COMP=
          echo "::endgroup::"

          if ! git diff --exit-code --stat -- assets/images; then
            echo "::error::Des SVG sont désynchronisés de leurs sources D2. Lancer 'make build.diagrams' et commiter les fichiers régénérés."
            exit 1
          fi

      - name: 'Check build static'
        run: |
          bin/console sass:build --ansi
          bin/console asset-map:compile --ansi
          bin/console stenope:build --no-interaction -vvv --ansi
        env:
          APP_ENV: prod
          NODE_ENV: production

---
services:
  php:
    build:
      context: .
      target: app_php
      args:
        COMPOSER_GITHUB_TOKEN: ${COMPOSER_GITHUB_TOKEN:-}
        # Host user, exported by the Makefile (default 1000)
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    env_file:
      - path: .env.docker.local
        required: false
    volumes:
      - ./:/srv
      - ${SSH_AUTH_SOCK}:${SSH_AUTH_SOCK}
      - ~/.ssh:/home/app/.ssh
      - php-socket:/var/run/php
      - composercache:/home/app/.composer
    environment:
      - SSH_AUTH_SOCK=${SSH_AUTH_SOCK}

  nginx:
    build:
      context: .
      target: app_nginx
    depends_on:
      - php
    volumes:
      - php-socket:/var/run/php
      - ./public:/srv/public:ro
      - ./docker/nginx/certs:/etc/nginx/certs
    ports:
      - "80:80"
      - "443:443"

  assets:
    profiles:
      - node
    image: node:24-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /srv
    env_file:
      - path: .env.docker.local
        required: false
    volumes:
      - ./:/srv
    environment:
      # npm cache: the host UID may have no home directory in the image
      HOME: /tmp
    ports:
      - "8000:8080"

###> symfony/mailer ###
  mailpit:
    image: axllent/mailpit
    # restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailer_data:/data
###< symfony/mailer ###

volumes:
  php-socket:
  mailer_data:
  composercache:
